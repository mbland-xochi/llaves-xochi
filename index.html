<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg: #ffffff;
  --panel: #ffffff;
  --panel-2: #eef2f5;
  --grid: #e0e6eb;
  --grid-soft: #f2f5f7;
  --text: #14406d;
  --text-dim: #5f6b76;
  --text-faint: #8d96a0;
  --accent: #0093d0;
  --accent-dark: #14406d;
  --accent-green: #0c7a3d;
  --danger: #a8493a;
  --success: #0c7a3d;
  --warning: #ffc600;
  --accent-on-dark: #1fb3e5;
  --radius: 3px;
  --shadow-sm: 0 1px 2px rgba(20,30,45,0.05), 0 4px 16px rgba(20,30,45,0.06);
  --font-display: 'Poppins', system-ui, -apple-system, sans-serif;
  --font-body: 'Poppins', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  padding: 0 0 60px 0;
}

.wrap{ max-width: 1100px; margin: 0 auto; padding: 32px 20px 0; }

/* Header */
.brand-bar{
  height: 4px;
  width: 64px;
  border-radius: 2px;
  margin-bottom: 20px;
  background: linear-gradient(90deg, var(--accent-dark), var(--accent) 55%, var(--accent-green));
}
.header-row{ display:flex; align-items:center; gap: 18px; }
.brand-logo{ height: 46px; width:auto; flex-shrink:0; display:block; }
.eyebrow{
  font-family: var(--font-body);
  font-size: 11px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--accent-dark);
  margin: 0 0 6px 0;
}
h1{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;
  letter-spacing: -0.3px;
  margin: 0 0 4px 0;
  color: var(--text);
}
.subtitle{ color: var(--text-dim); font-size: 14px; margin: 0 0 28px 0; }

/* Stat bar */
.stats{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--grid);
  border: 1px solid var(--grid);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 28px;
}
.stats{ box-shadow: var(--shadow-sm); }
.stat{ background: var(--panel); padding: 14px 16px; }
.stat-num{ font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--accent-dark); }
.stat-label{ font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

/* Route diagram */
.route-panel{
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: var(--radius);
  padding: 20px 20px 8px;
  margin-bottom: 24px;
  position: relative;
  box-shadow: var(--shadow-sm);
}
.route-panel::before{
  content: "CA-2 · KM142 — KM173";
  position: absolute;
  top: -9px;
  left: 16px;
  background: var(--bg);
  padding: 0 8px;
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--text-faint);
}
.route-scroll{ overflow-x: auto; }
.route-svg{ width: 100%; min-width: 560px; height: auto; display:block; }
.node-circle{ fill: var(--panel-2); stroke: var(--grid); stroke-width: 1.5; cursor: pointer; transition: all .15s ease; }
.node-circle:hover{ stroke: var(--accent); }
.node-circle.active{ fill: var(--accent-dark); stroke: var(--accent); }
.node-label{ font-family: var(--font-body); font-size: 13px; fill: var(--text); font-weight: 600; cursor:pointer; }
.node-badge{ fill: var(--bg); stroke: var(--grid); stroke-width: 1; }
.node-badge-text{ font-family: var(--font-body); font-size: 10px; fill: var(--accent-green); font-weight: 600; }
.route-line{ stroke: var(--grid); stroke-width: 1.5; stroke-dasharray: 4 3; }
.dist-label{ font-family: var(--font-body); font-size: 10px; fill: var(--text-faint); }
.node-label.active-text{ fill: var(--bg); }

/* Filter row */
.filter-row{ display:flex; align-items:center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.filter-left{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.chip{
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--text-dim);
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: var(--radius);
  padding: 5px 10px;
}
.chip.all-btn{ cursor:pointer; }
.chip.all-btn:hover{ border-color: var(--accent); color: var(--text); }

.search-input{
  background: var(--panel);
  border: 1px solid var(--grid);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 8px 12px;
  border-radius: var(--radius);
  min-width: 220px;
}
.search-input:focus{ outline: none; border-color: var(--accent); }

button{ font-family: var(--font-body); cursor: pointer; }
.btn{
  background: var(--panel-2);
  border: 1px solid var(--grid);
  color: var(--text);
  font-size: 13px;
  padding: 8px 14px;
  border-radius: var(--radius);
  transition: all .12s ease;
}
.btn:hover{ border-color: var(--accent); }
.btn-primary{ background: var(--accent-dark); border-color: var(--accent-dark); color: #ffffff; font-weight: 600; }
.btn-primary:hover{ filter: brightness(1.18); }
.btn-ghost{ background: transparent; border-color: var(--grid); color: var(--text-dim); }
.btn-ghost:hover{ color: var(--text); }
.btn-sm{ padding: 5px 10px; font-size: 12px; }
.btn-danger-text{ color: var(--danger); }

/* Table */
.table-panel{
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 28px;
  box-shadow: var(--shadow-sm);
}
table{ width: 100%; border-collapse: collapse; font-size: 13px; }
thead th{
  text-align: left;
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 10px 14px;
  border-bottom: 1px solid var(--grid);
  background: var(--grid-soft);
}
tbody td{ padding: 11px 14px; border-bottom: 1px solid var(--grid-soft); vertical-align: middle; }
tbody tr:last-child td{ border-bottom: none; }
tbody tr:hover{ background: rgba(0,147,208,0.05); }
.key-code{ font-family: var(--font-mono); font-size: 12px; color: var(--accent-dark); }
.badge{
  font-family: var(--font-body);
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 2px;
  letter-spacing: 0.5px;
}
.badge-master{ background: rgba(0,147,208,0.12); color: var(--accent-dark); border: 1px solid rgba(0,147,208,0.3); }
.badge-single{ background: rgba(143,163,184,0.1); color: var(--text-dim); border: 1px solid var(--grid); }
.status-out{ color: var(--danger); font-size: 12px; }
.status-out.overdue{ font-weight: 700; }
.status-in{ color: var(--success); font-size: 12px; }
.row-actions{ display:flex; gap: 6px; white-space: nowrap; }
.empty-row td{ text-align:center; padding: 40px; color: var(--text-faint); font-size: 13px; }

/* Log panel */
.log-panel{
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: var(--radius);
  padding: 4px 0 0;
  margin-bottom: 28px;
  box-shadow: var(--shadow-sm);
}
.log-header{ display:flex; justify-content:space-between; align-items:center; padding: 14px 16px 10px; }
.log-title{ font-family: var(--font-body); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); }
.log-list{ max-height: 220px; overflow-y: auto; }
.log-item{ display:flex; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--grid-soft); font-size: 12.5px; align-items:baseline; }
.log-item .lcode{ font-family: var(--font-mono); color: var(--accent-dark); min-width: 150px; }
.log-item .lperson{ color: var(--text); min-width: 130px; }
.log-item .laction{ min-width: 70px; font-weight:600; }
.log-item .laction.out{ color: var(--danger); }
.log-item .laction.in{ color: var(--success); }
.log-item .ltime{ color: var(--text-faint); margin-left:auto; font-family: var(--font-body); font-size: 11px; }

/* Footer actions */
.footer-actions{ display:flex; justify-content: space-between; align-items:center; padding-top: 4px; }
.footer-note{ font-size: 11.5px; color: var(--text-faint); }

/* Modal */
.overlay{
  position: fixed; inset: 0; background: rgba(5,10,16,0.65);
  display:none; align-items:center; justify-content:center; z-index: 50; padding: 20px;
}
.overlay.show{ display:flex; }
.modal{
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: var(--radius);
  width: 100%; max-width: 460px;
  padding: 22px;
  box-shadow: 0 8px 40px rgba(20,15,5,0.18);
}
.modal h3{ font-family: var(--font-display); font-size: 17px; margin: 0 0 16px; color: var(--text); }
.field{ margin-bottom: 13px; }
.field label{ display:block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; font-family: var(--font-body); }
.field input, .field select, .field textarea{
  width: 100%;
  background: var(--grid-soft);
  border: 1px solid var(--grid);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 9px 10px;
  border-radius: var(--radius);
}
.field input:focus, .field select:focus, .field textarea:focus{ outline: none; border-color: var(--accent); }
.field-hint{ font-size: 11px; color: var(--text-faint); margin-top: 4px; }
.field-row{ display:flex; gap: 10px; }
.field-row .field{ flex: 1; }
.modal-actions{ display:flex; justify-content:flex-end; gap: 8px; margin-top: 18px; }
.modal-error{ color: var(--danger); font-size: 12px; margin-top: 10px; }

.login-card{ max-width: 380px; margin: 72px auto 0; padding: 32px 28px; text-align:center; background: var(--panel); border: 1px solid var(--grid); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.login-card .brand-logo{ display:block; height: 52px; margin: 0 auto 18px; }
.login-card h1{ margin-bottom: 6px; }
.login-card .subtitle{ margin-bottom: 22px; }
.login-card .field{ text-align:left; }
.login-card .modal-error{ min-height: 16px; text-align:left; }
.login-btn{ width: 100%; margin-top: 8px; justify-content:center; }
.modal-text{ font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 0; }
.code-suggest{ font-family: var(--font-body); font-size: 11px; color: var(--accent-dark); cursor:pointer; margin-top: 4px; display:inline-block; }
.code-suggest:hover{ text-decoration: underline; }

.chips-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top: 6px; }
.mini-chip{
  font-family: var(--font-body); font-size: 11px; color: var(--text-dim);
  background: var(--grid-soft); border: 1px solid var(--grid); border-radius: 2px;
  padding: 3px 7px; cursor: pointer;
}
.mini-chip:hover{ color: var(--accent-dark); border-color: var(--accent); }

.loading{ padding: 60px 0; text-align:center; color: var(--text-faint); font-family: var(--font-body); font-size: 12px; letter-spacing: 1px; }

.sync-banner{ display:flex; align-items:center; justify-content:space-between; gap: 12px; background: rgba(255,198,0,0.14); border: 1px solid rgba(255,198,0,0.45); color: var(--text); font-family: var(--font-body); font-size: 12.5px; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 18px; }
.sync-banner button{ background:none; border:1px solid currentColor; color: inherit; font-family: var(--font-body); font-size: 11px; font-weight:600; padding: 4px 10px; border-radius: var(--radius); cursor:pointer; white-space:nowrap; }
.sync-banner button:hover{ background: rgba(0,0,0,0.05); }

/* Building page */
.back-row{ margin-bottom: 14px; }
.back-link{ font-family: var(--font-body); font-size: 12px; letter-spacing: 0.5px; color: var(--text-dim); cursor: pointer; }
.back-link:hover{ color: var(--accent-dark); }

.cabinet-panel{
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.cabinet-top{
  background: var(--accent-dark);
  color: #fff;
  padding: 12px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 3px solid var(--accent-green);
}
.cabinet-brand{ font-family: var(--font-body); font-size: 10.5px; letter-spacing: 2px; color: #cfe3ee; }
.cabinet-building{ font-family: var(--font-body); font-size: 13px; font-weight: 600; letter-spacing: 1px; color: var(--accent-on-dark); }

.legend-row{ display:flex; gap: 18px; padding: 14px 18px 6px; flex-wrap: wrap; }
.legend-item{ display:flex; align-items:center; gap: 7px; font-size: 11.5px; color: var(--text-dim); font-family: var(--font-body); }
.led{ width: 11px; height: 11px; border-radius: 50%; display:inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); flex-shrink:0; }
.led-green{ background: var(--success); box-shadow: 0 0 5px rgba(63,122,90,0.55), inset 0 0 0 1px rgba(0,0,0,0.1); }
.led-orange{ background: var(--warning); box-shadow: 0 0 5px rgba(201,122,46,0.55), inset 0 0 0 1px rgba(0,0,0,0.1); }
.led-red{ background: var(--danger); box-shadow: 0 0 5px rgba(168,73,58,0.6), inset 0 0 0 1px rgba(0,0,0,0.1); }

.cabinet-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 10px;
  padding: 14px 18px 22px;
}
.key-slot{
  background: var(--grid-soft);
  border: 1px solid var(--grid);
  border-radius: 4px;
  padding: 13px 8px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  text-align: center;
  transition: all .12s ease;
}
.key-slot:hover{ border-color: var(--accent); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.key-slot.is-master{ background: rgba(0,147,208,0.12); border: 1px solid rgba(0,147,208,0.3); }
.key-slot.is-master:hover{ border-color: var(--accent); }
.slot-code{ font-family: var(--font-mono); font-size: 10.5px; color: var(--text); font-weight: 600; word-break: break-all; line-height:1.3; }
.slot-area{ font-size: 9.5px; color: var(--text-faint); }
.add-slot{ border-style: dashed; justify-content: center; color: var(--text-faint); }
.add-slot:hover{ color: var(--accent-dark); border-color: var(--accent); }
.add-icon{ font-size: 19px; line-height: 1; }

@media (max-width: 640px){
  .stats{ grid-template-columns: repeat(2,1fr); }
  .table-panel{ overflow-x:auto; }
  table{ min-width: 640px; }
}
@media (max-width: 480px){
  .header-row{ flex-direction: column; align-items: flex-start; gap: 10px; }
  .brand-logo{ height: 38px; }
}
</style>

const API_URL = 'https://script.google.com/macros/s/AKfycbyxFrcpF9liS_ZOTqijgjKmKEP_Vm_cn_s4jYiaXEJKTA6-VM-_CsC7xGA6P0W_7adSJg/exec';
// La clave de acceso NO está en este archivo: se valida en el servidor (Code.gs).
const SESSION_KEY = 'xochi-llaves-session';
let session = null;
let lastSyncError = null;

const DEFAULT_DB = {
  buildings: [
    { id: 'km145', label: 'KM145' },
    { id: 'km152', label: 'KM152' },
    { id: 'km162', label: 'KM162' },
    { id: 'km173', label: 'KM173' }
  ],
  keys: [],
  log: []
};

let db = null;
let activeBuilding = 'all';
let searchTerm = '';
let currentView = 'home'; // 'home' | 'building'

function goToBuilding(id){
  activeBuilding = id;
  currentView = 'building';
  render();
}

function goHome(){
  currentView = 'home';
  activeBuilding = 'all';
  render();
}

function quickToggle(keyId){
  const st = keyStatus(keyId);
  openCheckModal(keyId, st.out ? 'in' : 'out');
}

const AREA_SUGGESTIONS = ['ADMIN','MTTO','CASETA','BODEGA','ELEC','SIST'];

function uid(){ return Math.random().toString(36).slice(2,9); }

function syncBanner(){
  if(!lastSyncError) return '';
  return `<div class="sync-banner">⚠ Sin conexión con el servidor (Google Sheets): ${lastSyncError}. Los cambios no se guardarán hasta reconectar. <button onclick="refreshNow()">Reintentar</button></div>`;
}

async function apiRequest(action, payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    // text/plain evita el preflight CORS que Apps Script no maneja bien
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ session, action, payload: payload || {} })
  });
  if(!res.ok){ throw new Error('HTTP ' + res.status); }
  const json = await res.json();
  if(json.code === 'AUTH'){ endSession(); throw new Error('Sesión expirada. Inicia sesión de nuevo.'); }
  if(!json.ok){ throw new Error(json.error || 'Error desconocido del servidor.'); }
  return json.data;
}

function getStoredSession(){ try{ return localStorage.getItem(SESSION_KEY); }catch(e){ return null; } }
function storeSession(v){ try{ if(v){ localStorage.setItem(SESSION_KEY, v); } else { localStorage.removeItem(SESSION_KEY); } }catch(e){} }

function endSession(){
  session = null;
  db = null;
  storeSession(null);
  closeModal();
  renderLogin();
}
function logout(){ endSession(); }

function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="login-card">
      <img src="data:image/png;base64,${LOGO_B64}" alt="Xochi" class="brand-logo">
      <h1>Registro de llaves</h1>
      <p class="subtitle">Acceso restringido. Ingresa la clave para continuar.</p>
      <form onsubmit="return submitLogin(event)">
        <div class="field">
          <label>Clave de acceso</label>
          <input type="password" id="login-clave" autocomplete="current-password">
        </div>
        <div id="login-error" class="modal-error"></div>
        <button type="submit" id="login-btn" class="btn btn-primary login-btn">Entrar</button>
      </form>
    </div>
  `;
  setTimeout(()=>{ const i = document.getElementById('login-clave'); if(i) i.focus(); }, 0);
}

async function submitLogin(ev){
  if(ev) ev.preventDefault();
  const input = document.getElementById('login-clave');
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  const clave = input.value;
  if(!clave){ err.textContent = 'Ingresa la clave.'; return false; }
  btn.disabled = true;
  err.textContent = '';
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'login', payload: { clave } })
    });
    if(!res.ok){ throw new Error('HTTP ' + res.status); }
    const json = await res.json();
    if(!json.ok){ throw new Error(json.error || 'No se pudo iniciar sesión.'); }
    session = json.data.session;
    storeSession(session);
    await loadDB();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false;
    input.value = '';
    input.focus();
  }
  return false;
}

async function loadDB(){
  if(!session){ return; }
  try{
    const data = await apiRequest('getAll', {});
    db = { buildings: DEFAULT_DB.buildings, keys: data.keys || [], log: data.log || [] };
    lastSyncError = null;
  }catch(e){
    if(!session){ return; } // sesión expirada: ya se mostró el login
    db = db || structuredClone(DEFAULT_DB);
    lastSyncError = e.message || 'No se pudo conectar con el servidor.';
  }
  render();
}

function buildingLabel(id){
  const b = db.buildings.find(x=>x.id===id);
  return b ? b.label : id;
}

function keyStatus(keyId){
  const entries = db.log.filter(l=>l.keyId===keyId).sort((a,b)=>a.ts-b.ts);
  if(entries.length===0) return { out:false };
  const last = entries[entries.length-1];
  if(last.action==='out') return { out:true, person:last.person, ts:last.ts };
  return { out:false };
}

function daysSince(ts){ return Math.floor((Date.now()-ts)/86400000); }

function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('es-GT',{ day:'2-digit', month:'short', year:'numeric' });
}

function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function exportCSV(){
  const rows = [['Edificio','Codigo','Area','Tipo','Copias','Ultima auditoria','Estado','Responsable actual','Notas']];
  db.keys.forEach(k=>{
    const st = keyStatus(k.id);
    rows.push([
      buildingLabel(k.buildingId), k.code, k.area, k.type==='master'?'Maestra':'Individual',
      k.copies, k.lastAudited || '', st.out ? 'Fuera' : 'En caja', st.out ? st.person : '', k.notes||''
    ]);
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'registro-llaves-xochi.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function openModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeModal();
});

let _confirmCallback = null;
function askConfirm(message, callback){
  _confirmCallback = callback;
  openModal(`
    <h3>Confirmar</h3>
    <p class="modal-text">${message}</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="runConfirm()">Confirmar</button>
    </div>
  `);
}
function runConfirm(){
  const cb = _confirmCallback;
  _confirmCallback = null;
  closeModal();
  if(cb) cb();
}

function suggestCode(){
  const b = document.getElementById('f-building').value;
  const area = (document.getElementById('f-area').value || 'AREA').toUpperCase().replace(/\s+/g,'');
  const type = document.getElementById('f-type').value;
  const suffix = type==='master' ? 'M' : '01';
  document.getElementById('f-code').value = `${b.toUpperCase()}-${area}-${suffix}-A`;
}

function fillArea(val){
  document.getElementById('f-area').value = val;
}

    { buildingId: activeBuilding!=='all'?activeBuilding:db.buildings[0].id, type:'single', copies:1 },
    defaults || {}
  );
  const buildingOptions = db.buildings.map(b=>`<option value="${b.id}" ${k.buildingId===b.id?'selected':''}>${b.label}</option>`).join('');
  openModal(`
    <h3>${isEdit?'Editar llave':'Agregar llave'}</h3>
    <div class="field-row">
      <div class="field">
        <label>Edificio</label>
        <select id="f-building">${buildingOptions}</select>
      </div>
      <div class="field">
        <label>Tipo</label>
        <select id="f-type">
          <option value="single" ${k.type==='single'?'selected':''}>Individual</option>
          <option value="master" ${k.type==='master'?'selected':''}>Maestra</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Área / puerta</label>
      <input id="f-area" placeholder="Ej. Oficina administracion" value="${k.area||''}">
      <div class="chips-row">
        ${AREA_SUGGESTIONS.map(a=>`<span class="mini-chip" onclick="fillArea('${a}')">${a}</span>`).join('')}
      </div>
    </div>
    <div class="field">
      <label>Código de llave</label>
      <input id="f-code" placeholder="KM145-ADMIN-01-A" value="${k.code||''}" style="font-family:var(--font-mono)">
      <span class="code-suggest" onclick="suggestCode()">Sugerir código →</span>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Copias existentes</label>
        <input id="f-copies" type="number" min="1" value="${k.copies||1}">
      </div>
      <div class="field">
        <label>Última auditoría</label>
        <input id="f-audited" type="date" value="${k.lastAudited||''}">
      </div>
    </div>
    <div class="field">
      <label>Notas</label>
      <textarea id="f-notes" rows="2" placeholder="Opcional">${k.notes||''}</textarea>
    </div>
    <div id="modal-error" class="modal-error"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveKey(${isEdit?`'${k.id}'`:'null'})">${isEdit?'Guardar cambios':'Agregar llave'}</button>
    </div>
  `);
}

async function saveKey(id){
  const buildingId = document.getElementById('f-building').value;
  const type = document.getElementById('f-type').value;
  const area = document.getElementById('f-area').value.trim();
  const code = document.getElementById('f-code').value.trim();
  const copies = parseInt(document.getElementById('f-copies').value)||1;
  const lastAudited = document.getElementById('f-audited').value;
  const notes = document.getElementById('f-notes').value.trim();

  if(!code){ document.getElementById('modal-error').textContent = 'El código de llave es obligatorio.'; return; }

  const payload = { id, buildingId, type, area, code, copies, lastAudited, notes };
  try{
    const data = await apiRequest(id ? 'updateKey' : 'addKey', payload);
    db.keys = data.keys; db.log = data.log;
    closeModal();
    render();
  }catch(e){
    document.getElementById('modal-error').textContent = 'No se pudo guardar: ' + e.message;
  }
}

function editKey(id){
  const k = db.keys.find(x=>x.id===id);
  openKeyModal(k);
}

function deleteKey(id){
  const k = db.keys.find(x=>x.id===id);
  askConfirm(`¿Eliminar la llave <strong>${k.code}</strong> del registro? Esta acción no se puede deshacer.`, async ()=>{
    try{
      const data = await apiRequest('deleteKey', { id });
      db.keys = data.keys; db.log = data.log;
      render();
    }catch(e){
      openModal(`<h3>No se pudo eliminar</h3><p class="modal-text">${e.message}</p><div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Cerrar</button></div>`);
    }
  });
}

function openCheckModal(keyId, actionType){
  const k = db.keys.find(x=>x.id===keyId);
  openModal(`
    <h3>${actionType==='out' ? 'Retirar llave' : 'Devolver llave'}</h3>
    <div class="field">
      <label>Llave</label>
      <input value="${k.code}" disabled>
    </div>
    <div class="field">
      <label>${actionType==='out' ? 'Nombre de quien retira' : 'Confirmar devolución'}</label>
      <input id="f-person" placeholder="Nombre completo" ${actionType==='in'?`value="${keyStatus(keyId).person||''}" disabled`:''}>
    </div>
    <div id="modal-error" class="modal-error"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="logAction('${keyId}','${actionType}')">${actionType==='out'?'Confirmar retiro':'Confirmar devolución'}</button>
    </div>
  `);
}

async function logAction(keyId, actionType){
  let person = document.getElementById('f-person').value.trim();
  if(actionType==='out' && !person){ document.getElementById('modal-error').textContent = 'Ingresa el nombre de la persona.'; return; }
  if(actionType==='in') person = keyStatus(keyId).person || '';
  try{
    const data = await apiRequest('logAction', { keyId, person, action: actionType });
    db.keys = data.keys; db.log = data.log;
    closeModal();
    render();
  }catch(e){
    document.getElementById('modal-error').textContent = 'No se pudo registrar: ' + e.message;
  }
}

function resetAll(){
  askConfirm('Esto borrará TODO el registro y bitácora para las 4 sedes. ¿Continuar?', ()=>{
    askConfirm('Confirma una vez más: se perderán todos los datos guardados. ¿Seguro?', async ()=>{
      try{
        const data = await apiRequest('resetAll', {});
        db.keys = data.keys; db.log = data.log;
        render();
      }catch(e){
        openModal(`<h3>No se pudo reiniciar</h3><p class="modal-text">${e.message}</p><div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Cerrar</button></div>`);
      }
    });
  });
}

function refreshNow(){ loadDB(); }

function setActiveBuilding(id){
  activeBuilding = id;
  render();
}

function renderRoute(){
  const nodesX = [90, 300, 500, 700];
  const positions = db.buildings.map((b,i)=>({...b, x: nodesX[i]}));
  const dists = ['7 km','10 km','11 km'];

  let svg = `<svg class="route-svg" viewBox="0 0 800 90" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<line x1="90" y1="55" x2="700" y2="55" class="route-line"/>`;

  positions.forEach((p,i)=>{
    if(i<positions.length-1){
      const midx = (p.x + positions[i+1].x)/2;
      svg += `<text x="${midx}" y="45" text-anchor="middle" class="dist-label">${dists[i]}</text>`;
    }
    const count = db.keys.filter(k=>k.buildingId===p.id).length;
    const isActive = activeBuilding===p.id;
    svg += `<g onclick="goToBuilding('${p.id}')">
      <circle cx="${p.x}" cy="55" r="22" class="node-circle ${isActive?'active':''}"/>
      <text x="${p.x}" y="60" text-anchor="middle" class="node-label ${isActive?'active-text':''}">${p.label}</text>
    </g>`;
    if(count>0){
      svg += `<circle cx="${p.x+16}" cy="38" r="9" class="node-badge"/>
      <text x="${p.x+16}" y="41" text-anchor="middle" class="node-badge-text">${count}</text>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

function renderCabinet(buildingId){
  const keys = db.keys.filter(k=>k.buildingId===buildingId);
  const slots = keys.map(k=>{
    const st = keyStatus(k.id);
    let ledClass = 'led-green', title = 'En caja';
    if(st.out){
      const d = daysSince(st.ts);
      if(d>=3){ ledClass = 'led-red'; title = `Fuera · ${st.person} (${d} días)`; }
      else{ ledClass = 'led-orange'; title = `Fuera · ${st.person} (${d} día${d===1?'':'s'})`; }
    }
    const masterClass = k.type==='master' ? 'is-master' : '';
    if(k.type==='master') title = `Maestra · ${title}`;
    return `<div class="key-slot ${masterClass}" onclick="quickToggle('${k.id}')" title="${title}">
      <span class="led ${ledClass}"></span>
      <span class="slot-code">${k.code}</span>
      ${k.area ? `<span class="slot-area">${k.area}</span>` : ''}
    </div>`;
  }).join('');

  const addSlot = `<div class="key-slot add-slot" onclick="openKeyModal(null, {buildingId:'${buildingId}'})" title="Agregar llave a esta sede">
    <span class="add-icon">+</span>
    <span class="slot-code">Agregar</span>
  </div>`;

  return `<div class="cabinet-grid">${slots}${addSlot}</div>`;
}

function filteredKeys(){
  let list = db.keys;
  if(activeBuilding!=='all') list = list.filter(k=>k.buildingId===activeBuilding);
  if(searchTerm){
    const t = searchTerm.toLowerCase();
    list = list.filter(k =>
      k.code.toLowerCase().includes(t) ||
      (k.area||'').toLowerCase().includes(t) ||
      (k.notes||'').toLowerCase().includes(t) ||
      buildingLabel(k.buildingId).toLowerCase().includes(t)
    );
  }
  return list;
}

function renderTableRows(){
  const list = filteredKeys();
  if(list.length===0){
    return `<tr class="empty-row"><td colspan="7">No hay llaves registradas ${activeBuilding!=='all'?'para esta sede':'todavía'}. Agrega la primera con el botón de arriba.</td></tr>`;
  }
  return list.map(k=>{
    const st = keyStatus(k.id);
    let statusHtml;
    if(st.out){
      const d = daysSince(st.ts);
      const overdue = d>=3;
      statusHtml = `<span class="status-out ${overdue?'overdue':''}">Fuera · ${st.person} (${d}d)</span>`;
    }else{
      statusHtml = `<span class="status-in">En caja</span>`;
    }
    return `<tr>
      <td class="key-code">${k.code}</td>
      <td>${buildingLabel(k.buildingId)}</td>
      <td>${k.area||'—'}</td>
      <td><span class="badge ${k.type==='master'?'badge-master':'badge-single'}">${k.type==='master'?'Maestra':'Individual'} · ${k.copies}</span></td>
      <td>${k.lastAudited ? fmtDate(new Date(k.lastAudited).getTime()) : '—'}</td>
      <td>${statusHtml}</td>
      <td class="row-actions">
        ${st.out
          ? `<button class="btn btn-sm" onclick="openCheckModal('${k.id}','in')">Devolver</button>`
          : `<button class="btn btn-sm" onclick="openCheckModal('${k.id}','out')">Retirar</button>`
        }
        <button class="btn btn-sm btn-ghost" onclick="editKey('${k.id}')">Editar</button>
        <button class="btn btn-sm btn-ghost btn-danger-text" onclick="deleteKey('${k.id}')">✕</button>
      </td>
    </tr>`;
  }).join('');
}

function renderLog(buildingId){
  let entries = [...db.log];
  if(buildingId){
    const idsInBuilding = new Set(db.keys.filter(k=>k.buildingId===buildingId).map(k=>k.id));
    entries = entries.filter(l=>idsInBuilding.has(l.keyId));
  }
  entries = entries.sort((a,b)=>b.ts-a.ts).slice(0,15);
  if(entries.length===0){
    return `<div class="log-item" style="color:var(--text-faint)">Sin movimientos registrados aún.</div>`;
  }
  return entries.map(l=>{
    const k = db.keys.find(x=>x.id===l.keyId);
    return `<div class="log-item">
      <span class="lcode">${k?k.code:'(eliminada)'}</span>
      <span class="lperson">${l.person||'—'}</span>
      <span class="laction ${l.action}">${l.action==='out'?'RETIRÓ':'DEVOLVIÓ'}</span>
      <span class="ltime">${fmtDate(l.ts)}</span>
    </div>`;
  }).join('');
}

function computeStats(){
  const total = db.keys.length;
  const out = db.keys.filter(k=>keyStatus(k.id).out).length;
  const masters = db.keys.filter(k=>k.type==='master').length;
  const overdue = db.keys.filter(k=>{
    const st = keyStatus(k.id);
    return st.out && daysSince(st.ts)>=3;
  }).length;
  return { total, out, masters, overdue };
}

function renderHomeView(){
  const s = computeStats();
  const buildingChips = db.buildings.map(b=>{
    const count = db.keys.filter(k=>k.buildingId===b.id).length;
    return `<span class="chip">${b.label}: ${count}</span>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    ${syncBanner()}
    <div class="brand-bar"></div>
    <div class="header-row">
      <img src="data:image/png;base64,${LOGO_B64}" alt="Xochi" class="brand-logo">
      <div>
        <p class="eyebrow">Xochi · Gestión de instalaciones</p>
        <h1>Registro de llaves</h1>
        <p class="subtitle">4 sedes · CA-2 KM142–KM173 · control centralizado de acceso físico</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-num">${s.total}</div><div class="stat-label">Llaves registradas</div></div>
      <div class="stat"><div class="stat-num">${s.out}</div><div class="stat-label">Fuera de caja</div></div>
      <div class="stat"><div class="stat-num">${s.masters}</div><div class="stat-label">Llaves maestras</div></div>
      <div class="stat"><div class="stat-num" style="color:${s.overdue>0?'var(--danger)':'var(--accent-dark)'}">${s.overdue}</div><div class="stat-label">Retiros +3 días</div></div>
    </div>

    <div class="route-panel">
      <div class="route-scroll">${renderRoute()}</div>
    </div>

    <div class="filter-row">
      <div class="filter-left">
        <span class="chip all-btn" onclick="setActiveBuilding('all')" style="${activeBuilding==='all'?'border-color:var(--accent);color:var(--text)':''}">Todas las sedes</span>
        ${buildingChips}
      </div>
      <div class="filter-left">
        <input class="search-input" placeholder="Buscar código, área…" value="${searchTerm}" oninput="searchTerm=this.value;render()">
        <button class="btn btn-primary" onclick="openKeyModal()">+ Agregar llave</button>
      </div>
    </div>

    <div class="table-panel">
      <table>
        <thead><tr>
          <th>Código</th><th>Sede</th><th>Área / puerta</th><th>Tipo</th><th>Última auditoría</th><th>Estado</th><th>Acciones</th>
        </tr></thead>
        <tbody>${renderTableRows()}</tbody>
      </table>
    </div>

    <div class="log-panel">
      <div class="log-header">
        <span class="log-title">Bitácora de movimientos</span>
      </div>
      <div class="log-list">${renderLog()}</div>
    </div>

    <div class="footer-actions">
      <span class="footer-note">Datos guardados en Google Sheets · compartido entre las 4 sedes.</span>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="logout()">Cerrar sesión</button>
        <button class="btn btn-ghost" onclick="exportCSV()">Exportar CSV</button>
        <button class="btn btn-ghost btn-danger-text" onclick="resetAll()">Reiniciar registro</button>
      </div>
    </div>
  `;
}

function renderBuildingView(id){
  const b = db.buildings.find(x=>x.id===id) || db.buildings[0];
  const keys = db.keys.filter(k=>k.buildingId===b.id);
  const out = keys.filter(k=>keyStatus(k.id).out).length;
  const overdue = keys.filter(k=>{
    const st = keyStatus(k.id);
    return st.out && daysSince(st.ts)>=3;
  }).length;

  document.getElementById('app').innerHTML = `
    ${syncBanner()}
    <div class="back-row">
      <span class="back-link" onclick="goHome()">← Volver al resumen</span>
    </div>
    <div class="brand-bar"></div>
    <div class="header-row">
      <img src="data:image/png;base64,${LOGO_B64}" alt="Xochi" class="brand-logo">
      <div>
        <p class="eyebrow">Xochi · Sede</p>
        <h1>${b.label}</h1>
        <p class="subtitle">${keys.length} llave${keys.length===1?'':'s'} registrada${keys.length===1?'':'s'} · ${out} fuera${overdue?` · ${overdue} con más de 3 días`:''}</p>
      </div>
    </div>

    <div class="route-panel">
      <div class="route-scroll">${renderRoute()}</div>
    </div>

    <div class="cabinet-panel">
      <div class="cabinet-top">
        <span class="cabinet-brand">XOCHI · CONTROL DE LLAVES</span>
        <span class="cabinet-building">${b.label}</span>
      </div>
      <div class="legend-row">
        <span class="legend-item"><span class="led led-green"></span>En caja</span>
        <span class="legend-item"><span class="led led-orange"></span>Fuera</span>
        <span class="legend-item"><span class="led led-red"></span>Fuera +3 días</span>
      </div>
      ${renderCabinet(b.id)}
    </div>

    <div class="table-panel">
      <table>
        <thead><tr>
          <th>Código</th><th>Sede</th><th>Área / puerta</th><th>Tipo</th><th>Última auditoría</th><th>Estado</th><th>Acciones</th>
        </tr></thead>
        <tbody>${renderTableRows()}</tbody>
      </table>
    </div>

    <div class="log-panel">
      <div class="log-header">
        <span class="log-title">Bitácora de esta sede</span>
      </div>
      <div class="log-list">${renderLog(b.id)}</div>
    </div>
  `;
}

function render(){
  if(currentView==='building' && activeBuilding!=='all'){
    renderBuildingView(activeBuilding);
  }else{
    renderHomeView();
  }
}

session = getStoredSession();
if(session){ loadDB(); } else { renderLogin(); }
// Refresca en segundo plano cada 25s para ver cambios hechos desde otra sede
setInterval(loadDB, 25000);
</script>
</body>
